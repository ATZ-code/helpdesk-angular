<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="logo">
        HD
      </div>

      <h1>HelpDesk</h1>

      <p>
        Sistema de gestión de tickets
      </p>

    </div>


    <div class="login-body">

      <form
        [formGroup]="loginForm"
        (ngSubmit)="iniciarSesion()">

        <div class="form-group">

          <label for="email">
            Correo electrónico
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              ✉
            </span>

            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="admin@helpdesk.dev"
              autocomplete="email">

          </div>

        </div>


        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔒
            </span>

            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password">

          </div>

        </div>


        <button
          class="login-button"
          type="submit"
          [disabled]="loginForm.invalid">

          Iniciar sesión

        </button>

      </form>

    </div>


    <div class="login-footer">

      <span>
        HelpDesk
      </span>

      <span>
        •
      </span>

      <span>
        Gestión de soporte
      </span>

    </div>

  </div>

</div>
