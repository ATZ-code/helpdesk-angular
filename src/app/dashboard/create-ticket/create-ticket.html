<div class="create-ticket">

  <div class="header">

    <div>

      <h1>
        Crear ticket
      </h1>

      <p>
        Registra una nueva solicitud
      </p>

    </div>


    <a
      routerLink="/dashboard"
      class="back-button">

      ← Volver

    </a>

  </div>


  <form
    [formGroup]="ticketForm"
    (ngSubmit)="crearTicket()">


    <div class="form-group">

      <label for="title">
        Título
      </label>

      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Título del ticket"
      />

      <small
        *ngIf="
          ticketForm.get('title')?.touched &&
          ticketForm.get('title')?.invalid
        ">

        El título es obligatorio.

      </small>

    </div>


    <div class="form-group">

      <label for="description">
        Descripción
      </label>

      <textarea
        id="description"
        rows="6"
        formControlName="description"
        placeholder="Describe el problema o solicitud">
      </textarea>

      <small
        *ngIf="
          ticketForm.get('description')?.touched &&
          ticketForm.get('description')?.invalid
        ">

        La descripción es obligatoria.

      </small>

    </div>


    <div class="form-group">

      <label for="priority">
        Prioridad
      </label>

      <select
        id="priority"
        formControlName="priority">

        <option value="low">
          Baja
        </option>

        <option value="medium">
          Media
        </option>

        <option value="high">
          Alta
        </option>

        <option value="urgent">
          Urgente
        </option>

      </select>

    </div>


    <div
      *ngIf="errorMessage"
      class="error">

      {{ errorMessage }}

    </div>


    <button
      type="submit"
      [disabled]="loading">

      {{ loading ? 'Creando...' : 'Crear ticket' }}

    </button>


  </form>

</div>
